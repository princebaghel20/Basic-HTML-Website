<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <fieldset>
    <legend align="center">Basic form</legend>
     <form>
        <label for="fullname">Full name</label>
        <input type="text" name="yourname" id="fullname" placeholder="enter your name">
        
        <br>
        <br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="enter your email">

        <br>
        <br>

        <label for="password">Password</label>
        <input
        type="password"
        name="password"
        id="password"
        placeholder="enter your password"
        >

        <br>
        <br>

        <label for="cfpassword">Confirm Password</label>
        <input
        type="password"
        name="cfpassword"
        id="cfpassword"
        placeholder="confirm your password"
         >
         <br>
         <br>

        <label for="dob">Date Of Birth</label>
        <input type="date" name="dob" id="dob">
        <br>
        <br>
        <label for="tob">Time Of Birth</label>
        <input type="time" name="tob" id="tod">

        <br>
        <br>

        <label for="joiningTime">Joining Time</label>
        <input type="datetime-local" name="joiningTime" id="joiningTime">

        <br>
        <br>

        <label for="volume">Volume</label>
        <input type="range" name="volume" id="volume" min="0" max="10" value="3">

        <br>
        <br>

        <label for="mobile"> Mobile :</label>
        <input type="number" name="mobile" id="mobile" placeholder="Enter your number">

        <br>
        <br>

        <label for="age">Age :</label>
        <input type="number" name="age" id="age" placeholder="Enter your age">

        <br>
        <br>

        <label for="resume">Resume</label>
        <input type="file" name="resume" id="resume">

        <br><br>

        <label for="address">Address</label>
        <textarea name="address" id="address"></textarea>
        <br><br>

        <label for="course">Course</label>
        <select name="course" id="course">
        <option value="">--Select Course--</option>
        <option value="btech">B.Tech</option>
        <option value="mba"> MBA</option>
        <option value="bca">BCA</option>
        </select>
        <br><br>

       
        <label for="gender">Gender :</label>
        <input type="radio" name="gender" id="male" value="male">
        <span>Male</span>
        <input type="radio" name="gender" id="female" value="male">
        <span>Female</span>
        
        <br>
        <br>
        
        <button>Submit</button>
  
    </form>
   </fieldset>
</body>
</html>
